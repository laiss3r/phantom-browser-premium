name: Build and verify Windows installer (no automatic publication)
on:
  push:
    branches: [main, feat/local-workspaces-v0.2]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.22.0', cache: npm}
      - run: npm ci
      - name: Bound package-network retries on the ephemeral runner
        run: |
          # Keep signed Ubuntu metadata verification; avoid the slow Azure HTTP mirror.
          if [ -f /etc/apt/apt-mirrors.txt ]; then printf 'https://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt; fi
          printf 'Acquire::Retries "1"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80phantom-network-timeouts
      - run: npx playwright install-deps chromium
        timeout-minutes: 10
      - run: sudo apt-get install -y libgtk-3-0
      - run: npm run typecheck && npm run lint && npm test
      - run: npm run test:runtime
      - run: npm run provision && npm run verify:runtime
      - run: npm run build
      - run: npm run test:integration -- --output=test-results/browser
      - run: xvfb-run -a npm run test:desktop -- --output=test-results/desktop
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    # Independent execution preserves all checks while allowing Windows evidence
    # even when an Ubuntu package mirror is unavailable. Overall CI still fails
    # if either job fails; there is no automatic release/publication step.
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.22.0', cache: npm}
      - run: npm ci
      - run: npm run provision
      - run: npm run verify:runtime
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:runtime
      - run: npm run build
      - run: npm run test:integration -- --output=test-results/browser
      - run: npm run test:desktop -- --output=test-results/desktop
      - run: npm run dist:win
      - name: Install the actual setup executable and smoke-test the installed application
        shell: pwsh
        run: |
          $setup = Get-ChildItem release/Phantom-Browser-Setup-*.exe | Select-Object -First 1
          if (!$setup) { throw 'Setup EXE missing' }
          $install = Join-Path $env:RUNNER_TEMP 'PhantomInstalled'
          $process = Start-Process -FilePath $setup.FullName -ArgumentList @('/S', "/D=$install") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $env:PHANTOM_INSTALLED_EXE = Join-Path $install 'Phantom Browser.exe'
          if (!(Test-Path $env:PHANTOM_INSTALLED_EXE)) { throw 'Installed executable missing' }
          npm run test:installed -- --output=test-results/installed
          if ($LASTEXITCODE -ne 0) { throw 'Installed application smoke test failed' }
      - name: Installer checksum
        shell: pwsh
        run: |
          Get-ChildItem release/Phantom-Browser-Setup-*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "release/$($_.Name).sha256"
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Phantom-Browser-Windows-Setup
          path: |
            release/Phantom-Browser-Setup-*.exe
            release/*.sha256
          if-no-files-found: error
      - name: Upload controlled installed-browser diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Phantom-controlled-installed-diagnostics
          path: |
            test-results/**/country-table-installed.png
            test-results/**/country-table-installed.json
            test-results/**/installed-fingerprint.json
            test-results/**/controlled-local-stun.json
            test-results/**/controlled-fingerprint.json
          if-no-files-found: warn
